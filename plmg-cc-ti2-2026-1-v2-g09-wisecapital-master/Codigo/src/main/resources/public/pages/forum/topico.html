<!doctype html>
<html lang="pt-PT">
  <head>

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="sidebar">
      <div class="sidebar-header">
        <img src="../../assets/img/logoazul.jpg" alt="Logo Wise Capital" />
        <h2>Wise Capital</h2>
      </div>

      <ul class="sidebar-links">
        <li>
          <a href="../../index.html"><i class="fas fa-home"></i> Início</a>
        </li>
        <li>
          <a href="../trilha/index.html"
            ><i class="fas fa-map-signs"></i> Trilha</a
          >
        </li>
        <li class="active">
          <a href="../forum/index.html"
            ><i class="fas fa-comments"></i> Fórum</a
          >
        </li>
        <li>
          <a href="../simulador/index.html"
            ><i class="fas fa-chart-line"></i> Simulador</a
          >
        </li>
        <li>
          <a href="../biblioteca/index.html"
            ><i class="fas fa-book-open"></i> Biblioteca</a
          >
        </li>
        <li>
          <a href="../noticias/index.html"
            ><i class="fas fa-newspaper"></i> Notícias</a
          >
        </li>
        <li>
          <a href="../faq/index.html"
            ><i class="fas fa-question-circle"></i> FAQ</a
          >
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="user-info">
          <i class="fas fa-user-circle"></i>
          <span id="user-name">Carregando...</span>
        </div>
        <button id="btn-logout" class="btn-logout">
          <i class="fas fa-sign-out-alt"></i> Sair
        </button>
      </div>

      <div class="topic-container">
        <a href="index.html" style="text-decoration: none; color: #0056b3"
          >&larr; Voltar ao Fórum</a
        >

        <div id="post-principal" style="margin-top: 20px"></div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd" />

        <h3>Comentários</h3>
        <form id="form-comentario" class="form-comentario-container">
          <input
            type="text"
            id="texto-comentario"
            placeholder="Escreve um comentário..."
            required
          />
          <button type="submit" class="btn-comentar">Comentar</button>
        </form>

        <div id="lista-comentarios"></div>
      </div>
    </main>

    <script type="module" src="../../js/modules/forumTopico.js"></script>
