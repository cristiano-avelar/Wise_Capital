<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar FAQ - Wise Capital</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../assets/img/logoazul.jpg" alt="Logo" class="logo" />
        <h2>Wise Capital</h2>
      </div>
      <ul class="sidebar-links">
        <li>
          <a href="../../index.html"><i class="fas fa-home"></i> Início</a>
        </li>
        <li>
          <a href="../trilha/index.html"
            ><i class="fas fa-map-signs"></i> Trilha</a
          >
        </li>
        <li>
          <a href="../forum/index.html"
            ><i class="fas fa-comments"></i> Fórum</a
          >
        </li>
        <li>
          <a href="../simulador/index.html"
            ><i class="fas fa-chart-line"></i> Simulador</a
          >
        </li>
        <li>
          <a href="../sobre/index.html"
            ><i class="fas fa-info-circle"></i> Sobre</a
          >
        </li>
        <li>
          <a href="../faq/faq.html"
            ><i class="fas fa-question-circle"></i> FAQ</a
          >
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="container" style="max-width: 600px; margin-top: 40px">
        <div style="margin-bottom: 20px">
          <a
            href="../faq/faq.html"
            style="text-decoration: none; color: #0056b3"
            ><i class="fas fa-arrow-left"></i> Voltar para o FAQ</a
          >
        </div>

        <h2>Painel do Administrador: Cadastrar Novo FAQ</h2>

        <form
          id="form-cadastro-faq"
          style="
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
          "
        >
          <div style="margin-bottom: 15px">
            <label
              for="faq-pergunta"
              style="display: block; font-weight: bold; margin-bottom: 5px"
              >Pergunta:</label
            >
            <input
              type="text"
              id="faq-pergunta"
              required
              style="
                width: 100%;
                padding: 10px;
                border: 1px solid #cbd5e1;
                border-radius: 4px;
              "
            />
          </div>

          <div style="margin-bottom: 20px">
            <label
              for="faq-resposta"
              style="display: block; font-weight: bold; margin-bottom: 5px"
              >Resposta:</label
            >
            <textarea
              id="faq-resposta"
              rows="5"
              required
              style="
                width: 100%;
                padding: 10px;
                border: 1px solid #cbd5e1;
                border-radius: 4px;
                resize: vertical;
              "
            ></textarea>
          </div>

          <button
            type="submit"
            style="
              background-color: #22c55e;
              color: white;
              border: none;
              padding: 12px 20px;
              font-weight: bold;
              border-radius: 4px;
              cursor: pointer;
              width: 100%;
            "
          >
            <i class="fas fa-save"></i> Salvar Pergunta
          </button>
        </form>
      </div>
    </main>

    <script>
    // Busca a variável que o login (auth.js) guardou na memória do navegador
    const isAdm = localStorage.getItem('usuario_adm') === 'true';
    
    // Se não for administrador, bloqueia o acesso e redireciona
    if (!isAdm) {
        alert('Acesso negado. Apenas administradores podem aceder a esta página.');
        window.location.href = '../faq/faq.html';
    }

    // Lógica para enviar o formulário e criar o novo FAQ
    document.getElementById('form-cadastro-faq').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const pergunta = document.getElementById('faq-pergunta').value;
        const resposta = document.getElementById('faq-resposta').value;

        try {
            await fetch("/faq/insert", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: `pergunta=${encodeURIComponent(pergunta)}&resposta=${encodeURIComponent(resposta)}`
            });

            alert('FAQ cadastrado com sucesso!');
            window.location.href = '../faq/faq.html'; // Redireciona de volta para a lista de FAQs

        } catch (error) {
            console.error("Erro ao inserir FAQ:", error);
            alert('Erro ao guardar o FAQ.');
        }
    });
  </script>
  </body>
</html>
